bio: >
  I am a Ph.D. student in Linguistics at the University of Arizona, advised by
  Dr. Sarah Phillips. My research focuses on psycholinguistics, bilingual language
  processing, and the syntax-prosody interface. I am especially interested in how
  native and non-native speakers of English integrate prosodic and syntactic cues
  during focus interpretation.

