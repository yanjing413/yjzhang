education:
  - degree: Ph.D. in Linguistics
    institution: University of Arizona
    start: 2023-08-01
    end: Present
    summary: |
      Advisor: Dr. Sarah Phillips

      Research areas:
      - Psycholinguistics
      - Bilingual language processing
      - Syntax-prosody interface
      - Focus processing
      - L1 and L2 English sentence processing

      My current project examines how native and non-native speakers of English
      integrate prosodic cues, such as pitch accent, and syntactic cues, such as
      cleft constructions, during focus interpretation.

  - degree: B.A. in English
    institution: Beijing Foreign Studies University
    start: 2019-09-01
    end: 2023-03-01
    summary: |
      Advisor: Dr. Zhaohong Wu

      Undergraduate research included work on phonological priming, Chinese
      four-character words, and multimodal discourse analysis.

experience:
  - role: Graduate Researcher
    org: Bilingual Acquisition and Psycholinguistics Lab, University of Arizona
    start: 2023-08-01
    summary: |
      Research experience includes:
      - Designed and conducted psycholinguistic experiments on focus processing
      - Investigated prosodic and syntactic cue integration in L1 and L2 English
      - Built experimental tasks involving syntactic structure, pitch accent placement, and question type
      - Analyzed behavioral data using R and mixed-effects models
      - Developed follow-up work using online processing methods, including eye-tracking

